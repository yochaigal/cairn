# The header's menus. Edit freely: each link is a site path (or a full URL) and its text.
# The sidebar is unchanged: it still comes from each page's parent / nav_order front matter.
#
# `sections` are the paths a menu covers: the header marks the menu on any page under one of them. A page under two
# menus' paths gets the longer one (Tools sits under /second-edition/, but it is a Resources link), so no page marks
# two menus.

menus:
  - title: Rules
    href: /second-edition/players-guide/core-rules/
    sections: [/second-edition/, /first-edition/, /barebones/]
    links:
      - [Core Rules, /second-edition/players-guide/core-rules/]
      - [Player's Guide, /second-edition/players-guide/]
      - [Warden's Guide, /second-edition/wardens-guide/]
      - [Backgrounds, /second-edition/backgrounds/]
      - [PDFs and game files, /second-edition/game-files/]
      - [Print copies, /second-edition/print-copies/]
      - [First Edition, /first-edition/]
      - [Barebones, /barebones/rules/]
  - title: Resources
    href: /resources/
    sections: [/resources/, /second-edition/tools/, /hacks/, /official-app/, /localization/]
    links:
      - [All resources, /resources/]
      - [Monsters, /resources/monsters/]
      - [Adventures, /adventures/]
      - [Tools, /second-edition/tools/character-generator/]
      - [Backgrounds, /second-edition/backgrounds/]
      - ["Relics, Spellbooks & Equipment", /resources/more-relics/]
      - ["Pregens", /resources/hirelings/]
      - [Hacks, /hacks/]
      - [Official App (Kettlewright), /official-app/]
      - [Translations, /localization/]
      - [Guides for Wardens, /resources/rules-summary/]

  - title: Adventures
    href: /adventures/
    sections: [/adventures/]
    links:
      - [All adventures, /adventures/]
      - [First Party, /adventures/first-party/]
      - [Originals, /adventures/originals/]
      - [Conversions, /adventures/conversions/]
      - [Submit an adventure, /submissions/submission-guide/]
  - title: Community
    href: /#home-share
    sections: [/newsletter/, /submissions/, /third-party/]
    links:
      - [Newsletter, /newsletter/subscribe/]
      - [Discord, /discord-server/]
      - [Submission guide, /submissions/submission-guide/]
      - [Third-party content, /third-party/]
      - [Translations, /localization/]
  - title: Store
    href: /store/books/
    sections: [/store/]
    links:
      - [Books, /store/books/]
      - [Cairn Press, /cairn-press/]
      - [Merch, /store/merch/]
