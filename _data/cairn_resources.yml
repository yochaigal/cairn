# The resource tiles: on the home page (framed squares, with counts) and on the Resources page (cards, with each
# page's summary and links). `summary_of` is the page whose `summary:` front matter is the card's text; `home: false` keeps a tile off the home page.
# A tile's count is the pages whose `parent:` is `count_parent`, the adventures in the catalog (`count: adventures`),
# or the translations (`count: languages`); `noun` is what it counts. With none of those, it counts its links as pages
# (_includes/cairn/tile-count.html).
# `art` is the picture behind a home tile, a file in assets/redesign/tiles/: a 560px square cut from the Cairn
# Adventure Series art in adventures/first-party/img/ (the file named beside each). A tile without one is plain.
- id: res-monsters
  art: monsters.webp   # cas-1/Vuk.webp
  title: Monsters
  href: /resources/monsters/
  count_parent: Monsters
  noun: monster
  summary_of: resources/monsters.md
- id: res-adventures
  art: adventures.webp   # cas-3/Dam.webp
  title: Adventures
  href: /adventures/
  count: adventures
  noun: adventure
  summary_of: adventures.md
  links:
    - [First Party, /adventures/first-party/]
    - [Originals, /adventures/originals/]
    - [Conversions, /adventures/conversions/]
- id: res-tools
  art: tools.webp   # cas-4/workshop.webp
  title: Tools
  href: /second-edition/tools/character-generator/
  links:
    - [Character Generator, /second-edition/tools/character-generator/]
    - [Build an Adventure Site, /first-edition/tools/build-an-adventure-site/]
    - [Converting Monsters, /first-edition/tools/converting-monsters/]
- id: res-backgrounds
  art: backgrounds.webp   # cas-3/Woodfolk.webp
  title: Backgrounds
  href: /second-edition/backgrounds/
