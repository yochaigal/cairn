# The resource tiles: on the home page (framed squares, with counts) and on the Resources page (cards, with each
# page's summary and links). `summary_of` is the page whose `summary:` front matter is the card's text; `home: false` keeps a tile off the home page.
# A tile's count is the pages whose `parent:` is `count_parent`, the adventures in the catalog (`count: adventures`),
# or the translations (`count: languages`); `noun` is what it counts. With none of those, it counts its links as pages
# (_includes/cairn/tile-count.html).
- id: res-monsters
  title: Monsters
  href: /resources/monsters/
  count_parent: Monsters
  noun: monster
  summary_of: resources/monsters.md
- id: res-adventures
  title: Adventures
  href: /adventures/
  count: adventures
  noun: adventure
  summary_of: adventures.md
  links:
    - [First Party, /adventures/first-party/]
    - [Originals, /adventures/originals/]
    - [Conversions, /adventures/conversions/]
