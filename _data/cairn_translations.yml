# The language switcher on rules pages (and the Translations tile's count). Each translation stays in its translator's
# own repo and site. `pages` maps a page here (its source path) to the same page in that translation; the switcher
# shows on any page at least one translation has, and lists the others as "not translated yet". It's a snapshot:
# add a line when a translation adds a page. `repo` is where to look for new ones. `site: false` means it has no site
# yet (its `pages` point at GitHub) and adds "(on GitHub)" after the name. `status` is shown after the name, in
# English. `flag` is the inside of a 24×16 SVG.

