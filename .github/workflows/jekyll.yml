name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  # rebuild weekly and on demand, so adventures added to Scrivener appear without a push here
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Scrivener's adventure posts, for the Adventures catalog (_plugins/cairn_adventures.rb). If this fails the
      # site still builds, listing this repo's adventure pages only.
      - name: Checkout Scrivener
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: yochaigal/scrivener
          path: _scrivener
          sparse-checkout: posts

      # Kettlewright's background, bond and pet data, for the character builder's Export for Kettlewright
      # (_plugins/cairn_kettlewright.rb). If this fails the site still builds, without the export.
      - name: Checkout Kettlewright
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: yochaigal/kettlewright
          path: _kettlewright
          sparse-checkout: app/static/json

      # Copies of the adventures' covers for the prophecy's book (_plugins/cairn_covers.rb), kept between runs so a
      # deploy fetches only new ones. A cover that changed behind the same address keeps its old copy: bump v1 to
      # fetch them all again.
      - name: Cover copies
        uses: actions/cache@v4
        with:
          path: .jekyll-cache/cairn-covers
          key: covers-v1-${{ github.run_id }}
          restore-keys: covers-v1-

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: default
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4